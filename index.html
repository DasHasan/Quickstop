<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quickstop Scoresheet</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #F5A623;
            min-height: 100vh;
            padding: 10px;
            padding-bottom: 100px;
        }

        .container {
            max-width: 100%;
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #1a1a1a;
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: 900;
        }

        .setup {
            margin-bottom: 20px;
        }

        .player-input {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        .player-input input {
            width: 100%;
            padding: 14px;
            border: 3px solid #1a1a1a;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 500;
        }

        .player-input input:focus {
            outline: none;
            border-color: #F5A623;
            box-shadow: 0 0 0 3px rgba(245, 166, 35, 0.2);
        }

        .player-list {
            margin: 15px 0;
            padding: 12px;
            background: #FFF5E6;
            border-radius: 8px;
            border: 2px solid #F5A623;
        }

        .player-list strong {
            color: #1a1a1a;
        }

        button {
            width: 100%;
            padding: 16px 20px;
            background: #1a1a1a;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            touch-action: manipulation;
        }

        button:active {
            transform: scale(0.98);
            background: #000;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .score-input-section {
            margin: 20px 0;
            padding: 15px;
            background: #FFF5E6;
            border-radius: 8px;
            border: 2px solid #F5A623;
        }

        .score-input-section h3 {
            margin-bottom: 15px;
            color: #1a1a1a;
            font-weight: 800;
        }

        .score-inputs {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 15px;
        }

        .score-input-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .score-input-row label {
            flex: 1;
            font-weight: bold;
            color: #1a1a1a;
            font-size: 16px;
        }

        .score-input-row input {
            width: 90px;
            padding: 14px;
            border: 3px solid #1a1a1a;
            border-radius: 8px;
            font-size: 20px;
            text-align: center;
            font-weight: bold;
        }

        .score-input-row input:focus {
            outline: none;
            border-color: #F5A623;
            box-shadow: 0 0 0 3px rgba(245, 166, 35, 0.2);
        }

        .table-container {
            overflow-x: auto;
            overflow-y: auto;
            margin-top: 20px;
            max-height: 400px;
            position: relative;
            border: 3px solid #1a1a1a;
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th, td {
            padding: 12px 8px;
            text-align: center;
            border: 1px solid #1a1a1a;
        }

        th {
            background: #1a1a1a;
            color: #F5A623;
            font-weight: bold;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        td {
            background: white;
            color: #1a1a1a;
        }

        tr:nth-child(even) td {
            background: #FFF5E6;
        }

        tfoot {
            position: sticky;
            bottom: 0;
            z-index: 10;
        }

        .total-row {
            font-weight: bold;
            background: #F5A623 !important;
        }

        .total-row td {
            background: #F5A623 !important;
            color: #1a1a1a;
            font-size: 18px;
            font-weight: 900;
            padding: 14px 8px;
            border: 2px solid #1a1a1a;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 480px) {
            body {
                padding: 8px;
            }

            .container {
                padding: 15px;
                border-radius: 8px;
            }

            h1 {
                font-size: 20px;
                margin-bottom: 15px;
            }

            th, td {
                padding: 10px 6px;
                font-size: 14px;
            }

            .total-row td {
                font-size: 16px;
            }

            .score-input-row input {
                width: 80px;
                font-size: 18px;
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Quickstop Scoresheet</h1>

        <div id="setup" class="setup">
            <div class="player-input">
                <input
                    type="text"
                    id="playerName"
                    placeholder="Spielername eingeben"
                    autocomplete="off"
                    enterkeyhint="done" />
                <button type="button" onclick="addPlayer()">Hinzufügen</button>
            </div>
            <button type="button" onclick="startGame()" id="startBtn" disabled>Spiel starten</button>
        </div>

        <div id="gameSection" class="hidden">
            <div class="score-input-section">
                <h3>Runde <span id="roundNumber">1</span></h3>
                <div id="scoreInputs" class="score-inputs"></div>
                <button type="button" onclick="addRound()">Runde hinzufügen</button>
            </div>

            <div class="table-container">
                <table id="scoreTable">
                    <thead>
                        <tr id="tableHeader">
                            <th>Runde</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                    <tfoot>
                        <tr class="total-row" id="totalRow">
                            <td>Summe</td>
                        </tr>
                    </tfoot>
                </table>
            </div>

            <button type="button" onclick="resetGame()" style="margin-top: 20px;">Neues Spiel</button>
        </div>
    </div>

    <script>
        let players = [];
        let rounds = [];
        let currentRound = 1;

        function addPlayer() {
            const input = document.getElementById('playerName');
            const name = input.value.trim();

            if (name && !players.includes(name)) {
                players.push(name);
                input.value = '';
                updatePlayerList();
                document.getElementById('startBtn').disabled = players.length === 0;
            }
        }

        function updatePlayerList() {
            const setup = document.getElementById('setup');
            let listHtml = '<div class="player-list"><strong>Spieler:</strong> ' + players.join(', ') + '</div>';

            const existingList = setup.querySelector('.player-list');
            if (existingList) {
                existingList.remove();
            }

            const playerInput = setup.querySelector('.player-input');
            playerInput.insertAdjacentHTML('afterend', listHtml);
        }

        function startGame() {
            if (players.length === 0) return;

            document.getElementById('setup').classList.add('hidden');
            document.getElementById('gameSection').classList.remove('hidden');

            // Setup table header
            const header = document.getElementById('tableHeader');
            players.forEach(player => {
                const th = document.createElement('th');
                th.textContent = player;
                header.appendChild(th);
            });

            // Setup total row
            const totalRow = document.getElementById('totalRow');
            players.forEach(() => {
                const td = document.createElement('td');
                td.textContent = '0';
                totalRow.appendChild(td);
            });

            // Setup score inputs
            setupScoreInputs();
        }

        function setupScoreInputs() {
            const container = document.getElementById('scoreInputs');
            container.innerHTML = '';

            players.forEach((player, index) => {
                const row = document.createElement('div');
                row.className = 'score-input-row';
                row.innerHTML = `
                    <label>${player}:</label>
                    <input
                        type="number"
                        id="score-${index}"
                        value="0"
                        min="0"
                        inputmode="numeric"
                        enterkeyhint="next" />
                `;
                container.appendChild(row);
            });

            // Focus first input
            const firstInput = document.getElementById('score-0');
            if (firstInput) {
                setTimeout(() => firstInput.focus(), 100);
            }
        }

        function addRound() {
            const scores = [];
            players.forEach((player, index) => {
                const input = document.getElementById(`score-${index}`);
                scores.push(parseInt(input.value) || 0);
                input.value = '0'; // Reset for next round
            });

            rounds.push(scores);

            // Add row to table
            const tbody = document.getElementById('tableBody');
            const row = document.createElement('tr');

            const roundCell = document.createElement('td');
            roundCell.textContent = currentRound;
            row.appendChild(roundCell);

            scores.forEach(score => {
                const cell = document.createElement('td');
                cell.textContent = score;
                row.appendChild(cell);
            });

            tbody.appendChild(row);

            // Update totals
            updateTotals();

            currentRound++;
            document.getElementById('roundNumber').textContent = currentRound;

            // Focus first input to keep keyboard open
            const firstInput = document.getElementById('score-0');
            if (firstInput) {
                setTimeout(() => firstInput.focus(), 100);
            }
        }

        function updateTotals() {
            const totals = new Array(players.length).fill(0);

            rounds.forEach(round => {
                round.forEach((score, index) => {
                    totals[index] += score;
                });
            });

            const totalRow = document.getElementById('totalRow');
            const cells = totalRow.querySelectorAll('td:not(:first-child)');

            totals.forEach((total, index) => {
                cells[index].textContent = total;
            });
        }

        function resetGame() {
            if (confirm('Möchtest du wirklich ein neues Spiel starten? Alle Daten gehen verloren.')) {
                players = [];
                rounds = [];
                currentRound = 1;

                document.getElementById('setup').classList.remove('hidden');
                document.getElementById('gameSection').classList.add('hidden');
                document.getElementById('playerName').value = '';
                document.getElementById('startBtn').disabled = true;

                // Clear table
                document.getElementById('tableHeader').innerHTML = '<th>Runde</th>';
                document.getElementById('tableBody').innerHTML = '';
                document.getElementById('totalRow').innerHTML = '<td>Summe</td>';
                document.getElementById('roundNumber').textContent = '1';

                // Remove player list
                const existingList = document.querySelector('.player-list');
                if (existingList) {
                    existingList.remove();
                }
            }
        }

        // Allow Enter key to add player and keep focus
        document.getElementById('playerName').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                addPlayer();
                // Keep focus on input for next player
                setTimeout(() => this.focus(), 100);
            }
        });
    </script>
</body>
</html>
